
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            color: white;

            background: #080808;
            overflow: hidden;
        }

        /* Background glow */
        body::before {
            content: "";
            position: fixed;
            width: 600px;
            height: 600px;

            background: radial-gradient(
                circle,
                rgba(255,255,255,0.08),
                transparent 65%
            );

            filter: blur(20px);
            animation: glow 5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                transform: scale(0.9);
                opacity: 0.5;
            }

            to {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .container {
            position: relative;
            width: min(650px, 90%);

            padding: 60px 35px;

            text-align: center;

            background: rgba(20,20,20,0.75);

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 25px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 30px 100px rgba(0,0,0,0.7);
        }

        /* Loading circle */
        .loader {
            width: 70px;
            height: 70px;

            margin: 0 auto 30px;

            border-radius: 50%;

            border: 3px solid #292929;
            border-top-color: white;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: clamp(35px, 7vw, 60px);
            letter-spacing: -2px;

            margin-bottom: 15px;
        }

        .subtitle {
            color: #8d8d8d;

            font-size: 16px;
            line-height: 1.7;

            margin-bottom: 30px;
        }

        /* Animated dots */
        .loading-text {
            color: #aaa;
            font-size: 14px;
        }

        .dots span {
            opacity: 0;
            animation: dots 1.5s infinite;
        }

        .dots span:nth-child(1) {
            animation-delay: 0s;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.3s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes dots {
            0%, 80%, 100% {
                opacity: 0;
            }

            40% {
                opacity: 1;
            }
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-top: 25px;

            padding: 8px 15px;

            border-radius: 50px;

            background: #121212;
            border: 1px solid #252525;

            color: #777;

            font-size: 13px;
        }

        .dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #6cff8b;

            box-shadow: 0 0 10px #6cff8b;
        }

        @media (max-width: 500px) {
            .container {
                padding: 45px 20px;
            }

            h1 {
                font-size: 38px;
            }

            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="loader"></div>

        <h1>რეკონსტრუქცია</h1>

        <p class="subtitle">
            ჩვენი ვებსაიტი ამჟამად რეკონსტრუქციის პროცესშია.<br>
            ჩვენ ვმუშაობთ ახალი და გაუმჯობესებული გამოცდილების შექმნაზე.
        </p>

        <div class="loading-text">
            მიმდინარეობს სამუშაოები
            <span class="dots">
                <span>.</span>
                <span>.</span>
                <span>.</span>
            </span>
        </div>

        <div class="status">
            <span class="dot"></span>
            სისტემა ონლაინ არის
        </div>

    </div>

</body>
</html>
